<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RAG Research Assistant</title>
<style>
  :root { --bg:#fff; --fg:#1b1f23; --muted:#6a737d; --card:#f6f8fa; --accent:#2563eb; --border:#d0d7de; --ok:#1a7f37; --err:#cf222e; }
  @media (prefers-color-scheme: dark) { :root { --bg:#0d1117; --fg:#e6edf3; --muted:#8b949e; --card:#161b22; --accent:#58a6ff; --border:#30363d; --ok:#3fb950; --err:#f85149; } }
  * { box-sizing: border-box; }
  body { margin:0; font:16px/1.5 system-ui, sans-serif; background:var(--bg); color:var(--fg); }
  main { max-width:760px; margin:0 auto; padding:24px 16px 64px; }
  h1 { font-size:1.5rem; margin:0 0 4px; }
  h2 { font-size:1rem; margin:0 0 8px; }
  .muted { color:var(--muted); }
  .box { background:var(--card); border:1px solid var(--border); border-radius:10px; padding:14px 16px; margin-top:16px; }
  .row { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  input[type=text] { flex:1; min-width:0; padding:10px 12px; font:inherit; color:inherit; background:var(--bg); border:1px solid var(--border); border-radius:8px; }
  input[type=file] { flex:1; min-width:0; font:inherit; color:var(--muted); }
  button { padding:10px 18px; font:inherit; color:#fff; background:var(--accent); border:0; border-radius:8px; cursor:pointer; }
  button.ghost { background:none; color:var(--accent); border:1px solid var(--border); }
  button:disabled { opacity:.6; cursor:wait; }
  #status { font-size:.9rem; margin-top:8px; }
  .ok { color:var(--ok); } .err { color:var(--err); }
  .a { margin:0; white-space:pre-wrap; }
  .meta { font-size:.8rem; margin-top:8px; }
  summary { cursor:pointer; color:var(--accent); margin-top:10px; }
  .src { border-left:3px solid var(--border); padding-left:10px; margin:10px 0; font-size:.9rem; }
</style>
</head>
<body>
<main>
  <h1>RAG Research Assistant</h1>
  <p class="muted">Upload documents, let the assistant study them, then ask questions. Answers include their sources.</p>

  <section class="box">
    <h2>1. Upload documents <span class="muted" style="font-weight:400">(.txt, .md, .pdf)</span></h2>
    <div class="row">
      <input id="files" type="file" multiple accept=".txt,.md,.pdf">
      <button id="up">Upload &amp; study</button>
      <button id="clear" class="ghost" hidden>Clear</button>
    </div>
    <div id="status" class="muted">Nothing uploaded: questions search the built-in sample documents.</div>
  </section>

  <section class="box">
    <h2>2. Ask a question</h2>
    <form class="row" id="form"><input type="text" id="q" placeholder="Ask a question..." minlength="3" maxlength="1000" required><button id="ask">Ask</button></form>
  </section>
  <div id="out"></div>
</main>
<script>
const $ = (id) => document.getElementById(id);
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text) e.textContent = text; return e; };
const status = (msg, cls = "muted") => { $("status").textContent = msg; $("status").className = cls; };
const fail = async (r) => (await r.json().catch(() => ({}))).detail || r.statusText;
let sid = null;

async function clearSession() {
  if (sid) await fetch("/session/" + sid, { method: "DELETE" }).catch(() => {});
  sid = null; $("clear").hidden = true;
}

$("up").onclick = async () => {
  const files = $("files").files;
  if (!files.length) return status("Choose at least one file.", "err");
  const fd = new FormData();
  for (const f of files) fd.append("files", f);
  $("up").disabled = true; status("Studying your documents...");
  try {
    const r = await fetch("/upload", { method: "POST", body: fd });
    if (!r.ok) throw new Error(await fail(r));
    const d = await r.json();
    await clearSession(); sid = d.session_id;
    $("clear").hidden = false; $("files").value = "";
    status(`Ready: ${d.files.join(", ")} (${d.chunks} passages). Questions now search only these files; deleted after ${d.expires_in_minutes} min idle.`, "ok");
  } catch (e) { status("Upload failed: " + e.message, "err"); }
  $("up").disabled = false;
};

$("clear").onclick = async () => { await clearSession(); status("Files cleared: questions search the built-in sample documents."); };

$("form").onsubmit = async (ev) => {
  ev.preventDefault();
  const question = $("q").value.trim();
  $("ask").disabled = true;
  const box = el("div", "box"), body = el("p", "a", "Thinking...");
  box.append(el("b", "", question), body); $("out").prepend(box);
  try {
    const r = await fetch("/ask", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ question, session_id: sid }) });
    if (r.status === 404) { sid = null; $("clear").hidden = true; status("Session expired. Upload your files again.", "err"); }
    if (!r.ok) throw new Error(await fail(r));
    const d = await r.json();
    body.textContent = d.answer;
    box.append(el("div", "meta muted", `${d.scope === "session" ? "your files" : "sample documents"} · ${d.mode} mode · ${Math.round(d.latency_ms)} ms`));
    const det = el("details"); det.append(el("summary", "", `Sources (${d.sources.length})`));
    d.sources.forEach((s) => { const w = el("div", "src"); w.append(el("b", "", `${s.source} · ${s.score}`), el("div", "", s.snippet + "...")); det.append(w); });
    box.append(det); $("q").value = "";
  } catch (e) { body.textContent = "Error: " + e.message; }
  $("ask").disabled = false;
};
</script>
</body>
</html>
